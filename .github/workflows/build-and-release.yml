name: Build & Release (Native AOT - Linux only)

# Runs on pushes to any branch. Tag pushes are excluded so the release
# job creating a tag does not re-trigger this workflow.
on:
  push:
    branches:
      - '**'

permissions:
  contents: write

concurrency:
  group: aot-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Native AOT linker prerequisites on Linux
      - name: Install Native AOT build prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish Native AOT binary
        run: >
          dotnet publish ReleaseForwarderDiscord.csproj
          -c Release
          -r ${{ matrix.rid }}
          -o ./publish
          --self-contained true

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p dist
          cd publish
          chmod +x ReleaseForwarderDiscord
          tar -czf "../dist/ReleaseForwarderDiscord-${{ matrix.rid }}.tar.gz" ReleaseForwarderDiscord

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReleaseForwarderDiscord-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all Linux artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Compute short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}-${{ steps.vars.outputs.sha_short }}
          name: "CI build #${{ github.run_number }} (${{ steps.vars.outputs.sha_short }})"
          prerelease: true
          generate_release_notes: true
          files: dist/*